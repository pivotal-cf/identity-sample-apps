apply plugin: 'java'

sourceCompatibility = '17'

repositories {
    mavenCentral()
}

ext {
    // 4.16.1 is the newest Selenium 4 that still includes EventFiringWebDriver
    // (required by FluentLenium 5.0.4) and ships with Selenium Manager for
    // automatic ChromeDriver resolution.
    seleniumVersion = '4.16.1'
}

dependencies {
    testImplementation 'org.fluentlenium:fluentlenium-junit:5.0.4'
    testImplementation 'org.fluentlenium:fluentlenium-assertj:5.0.4'

    testImplementation 'junit:junit:4.13.2'

    testImplementation "org.seleniumhq.selenium:selenium-chrome-driver:$seleniumVersion"
    testImplementation "org.seleniumhq.selenium:selenium-support:$seleniumVersion"

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

test {
    afterTest { desc, result ->
        logger.quiet "Executing test ${desc.name} [${desc.className}] with result: ${result.resultType}"
    }
}
