# Harness-owned UAA config override for the docker/podman-compose E2E environment.
#
# The oauth.clients / scim.users / jwt.token sections below are copied from
# ../../journeys/src/test/resources/uaa-customizations.yml (the canonical source of
# client/user/JWT-key definitions used by both the Concourse CI flow and this harness),
# with only the OAuth client redirect-uri hosts widened from localhost to compose
# service names. Keep the two files in sync if clients/users/scopes ever change.
#
# The issuer/login.saml sections below are specific to this containerized harness:
#  - issuer.uri uses the compose service name "uaa" instead of localhost, since
#    resource-server validates JWTs by calling UAA's OIDC discovery/JWKS endpoints
#    over the compose network, not via a browser-facing localhost URL.
#  - login.saml.keys provides a throwaway self-signed SAML SP signing key. UAA
#    v78.16.0 eagerly builds a self-referential SAML "relying party registration"
#    at startup, and its default (uncustomized) metadata generation fails hard with
#    "Metadata response is missing verification certificates" unless a SAML SP key is
#    configured. This project's sample apps only use OAuth2 (authorization_code /
#    client_credentials) and never touch SAML, so this key exists purely to let UAA
#    boot; it has no bearing on the sample apps' endpoint behavior.
